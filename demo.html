<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Vault — Demo Preview</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header class="app-header">
    <h1>Character Vault</h1>
    <p class="input-group__hint">
      Demo preview — no Firebase connected, edits log to the console instead of saving.
    </p>
  </header>
  <main class="app-main" id="app-main"></main>

  <script type="module">
    import * as mockStore from "./js/state/mockStore.js";
    import { renderCustomSheet } from "./js/render/customSheet.js";

    const character = await mockStore.loadCharacter("demo-1");
    renderCustomSheet(document.getElementById("app-main"), character, mockStore);
  </script>
</body>
</html>
