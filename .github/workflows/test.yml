name: test

# Push gate. Two jobs, about nine minutes total.
#
# The exhaustive crawl lives in crawl.yml rather than here. It used to be a
# third job in this workflow, but it had no timeout and had been silently
# broken for eleven commits, so on every push it showed as "Skipped" - which
# reads like something went wrong and tells you nothing about whether the app
# is covered. Splitting it out means this file contains only jobs that
# actually ran, and the crawl's absence from a push is just a push being fast.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    # These are all pure computation; 5 minutes is roughly 40x the local
    # total. Without this, a genuine hang (or an accidental infinite loop in a
    # compiler) burns GitHub's 6-hour default before anyone hears about it.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.mjs
      - run: node scripts/check-imports.mjs
      - run: node scripts/smoke-imports.mjs
      - run: node scripts/smoke-dom.mjs
      - run: node scripts/verify-content.mjs
      - run: node scripts/verify-generated.mjs

  e2e:
    runs-on: ubuntu-latest
    # ~4 minutes locally across desktop, tablet and mobile.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i --no-audit --no-fund
      # Full Chrome (not just headless shell): the print-dialog and
      # color-adjust assertions need the real engine.
      - id: setup-chrome
        uses: browser-actions/setup-chrome@latest
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  crawl-fast:
    runs-on: ubuntu-latest
    # ~4.5 minutes. Bounded iteration counts, full step coverage: it walks
    # every wizard step and every completion strategy, and stops early once a
    # step is satisfied. This is the only check that clicks EVERY control and
    # attributes a page error to the action that caused it, so it earns its
    # place on the push path - e2e walks real flows and asserts on them, which
    # is a different kind of coverage, not a substitute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i --no-audit --no-fund
      - id: setup-chrome
        uses: browser-actions/setup-chrome@latest
      - run: npm run test:crawl:fast
        env:
          PLAYWRIGHT_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}