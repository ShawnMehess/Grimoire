name: test

on:
  push:
    branches: [main]
  pull_request:
  # The exhaustive crawl runs nightly and on demand, not on every push. See the
  # crawl job for why.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    # These are all pure computation; 5 minutes is roughly 40x the local
    # total. Without this, a genuine hang (or an accidental infinite loop in a
    # compiler) burns GitHub's 6-hour default before anyone hears about it.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.mjs
      - run: node scripts/check-imports.mjs
      - run: node scripts/smoke-imports.mjs
      - run: node scripts/smoke-dom.mjs
      - run: node scripts/verify-content.mjs
      - run: node scripts/verify-generated.mjs

  e2e:
    runs-on: ubuntu-latest
    # ~4 minutes locally across desktop, tablet and mobile.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i --no-audit --no-fund
      # Full Chrome (not just headless shell): the print-dialog and
      # color-adjust assertions need the real engine.
      - id: setup-chrome
        uses: browser-actions/setup-chrome@latest
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  crawl:
    # Nightly and on demand only. This is the exhaustive audit - every row of
    # every race, class and background, every wizard step, every dialog - and
    # it takes tens of minutes, which is the wrong price for every push.
    #
    # It is a different KIND of check from e2e, not a weaker one. e2e walks the
    # real user flows and asserts on them; the crawl clicks everything and
    # attributes any page error to the action that caused it. Nothing e2e does
    # is removed from the push path to make room for this - the push gate is
    # the static checks plus e2e, and it stays under ~6 minutes.
    #
    # `--fast` is available and takes about 4 minutes with full step coverage
    # and capped iteration counts; the full sweep below is the nightly one.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i --no-audit --no-fund
      - id: setup-chrome
        uses: browser-actions/setup-chrome@latest
      - run: npm run test:crawl
        env:
          PLAYWRIGHT_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}